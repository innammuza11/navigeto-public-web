[build]
  command = "npx next build --webpack"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Retain the Next.js image route when publishing an already-built artifact.
# The runtime generates this rule during builds; explicit no-build releases
# must carry it from the source configuration as well.
[[redirects]]
  from = "/_next/image"
  to = "/.netlify/images?url=:url&w=:width&q=:quality"
  status = 200
  [redirects.query]
    url = ":url"
    w = ":width"
    q = ":quality"

# Customer-facing short link for the separate land-only Vietnam offer.
[[redirects]]
  from = "/vietnamcityescape"
  to = "https://navigeto-vietnam-city-escape.innammuza.chatgpt.site"
  status = 302
  force = true
